<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>家长监控面板 - 学习机活动监测</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👀</text></svg>" />
    <script type="module" crossorigin src="/assets/index-DyL3yaUg.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Bu8Hf3rA.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function addLogoutButton() {
          var topbar = document.querySelector('.topbar');
          if (!topbar || document.getElementById('logout-link')) return;

          var link = document.createElement('a');
          link.id = 'logout-link';
          link.href = '/logout.html';
          link.textContent = '退出登录';
          link.style.cssText = 'margin-left:12px;color:#666;text-decoration:none;font-size:14px;';
          topbar.appendChild(link);
        }

        function addResetLink() {
          var loginCard = document.querySelector('.login-card');
          if (!loginCard || document.getElementById('register-link')) return;

          var links = document.createElement('div');
          links.style.cssText = 'display:flex;justify-content:center;gap:18px;margin-top:14px;';

          var registerLink = document.createElement('a');
          registerLink.id = 'register-link';
          registerLink.href = '/register.html';
          registerLink.textContent = '注册账号';
          registerLink.style.cssText = 'color:#2563eb;text-decoration:none;font-size:14px;';

          var resetLink = document.createElement('a');
          resetLink.id = 'reset-link';
          resetLink.href = '/reset.html';
          resetLink.textContent = '忘记密码？';
          resetLink.style.cssText = 'color:#666;text-decoration:none;font-size:14px;';

          links.appendChild(registerLink);
          links.appendChild(resetLink);
          loginCard.appendChild(links);
        }

        function hideLegacyRegisterSwitch() {
          var loginCard = document.querySelector('.login-card');
          if (!loginCard) return;
          loginCard.querySelectorAll('.switch').forEach(function (node) {
            node.style.display = 'none';
          });
        }

        function updateLinks() {
          addLogoutButton();
          addResetLink();
          hideLegacyRegisterSwitch();
        }

        new MutationObserver(updateLinks).observe(document.documentElement, {
          childList: true,
          subtree: true
        });
        updateLinks();
      })();
    </script>
  </body>
</html>
