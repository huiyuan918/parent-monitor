<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <script type="module" crossorigin src="/assets/index-DyL3yaUg.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Bu8Hf3rA.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function addLogoutButton() {
          var topbar = document.querySelector('.topbar');
          if (!topbar || document.getElementById('logout-link')) return;

          var link = document.createElement('a');
          link.id = 'logout-link';
          link.href = '/logout.html';
          link.textContent = '退出登录';
          link.style.cssText = 'margin-left:12px;color:#666;text-decoration:none;font-size:14px;';
          topbar.appendChild(link);
        }

        new MutationObserver(addLogoutButton).observe(document.documentElement, {
          childList: true,
          subtree: true
        });
        addLogoutButton();
      })();
    </script>
  </body>
</html>
