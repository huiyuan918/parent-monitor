services:
  - type: web
    name: parent-monitor
    env: node
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: BIND_CODE
        value: 918918
      - key: DB_PATH
        value: /tmp/data.db
